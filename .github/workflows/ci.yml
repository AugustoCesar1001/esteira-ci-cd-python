name: Esteira CI/CD Python

on:
  push:
    branches:
      - feature/esteira
      - main

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Lint com flake8
        run: |
          python -m flake8 app tests

      - name: Tipagem com mypy
        run: |
          python -m mypy app

      - name: Segurança com bandit
        run: |
          python -m bandit -r app

      - name: Complexidade com radon
        run: |
          python -m radon cc app -a

      - name: Rodar testes com pytest
        run: |
          python -m pytest tests

      - name: Gerar arquivo summary.csv
        run: |
          mkdir -p output
          python -c "from app.pipeline import run_pipeline; run_pipeline('data/sales.csv', 'output/summary.csv')"

      - name: Publicar artifact
        uses: actions/upload-artifact@v4
        with:
          name: summary-csv
          path: output/summary.csv

  deploy:
    name: Deploy
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Baixar artifact aprovado
        uses: actions/download-artifact@v4
        with:
          name: summary-csv
          path: deploy_artifacts

      - name: Simular promoção para ambiente final
        run: |
          echo "Deploy autorizado para a branch main."
          echo "Artifact aprovado:"
          ls -R deploy_artifacts